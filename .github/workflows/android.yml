name: Build WEZTY APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Verify remote update configuration
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          config = json.loads(Path('capacitor.config.json').read_text())
          expected = 'https://abdelrahman533577-creator.github.io/Wezty-/'
          actual = config.get('server', {}).get('url')
          if actual != expected:
              raise SystemExit(f'Unexpected Capacitor server.url: {actual!r}')
          if not Path('google-services.json').is_file():
              raise SystemExit('Missing google-services.json in repository root')
          if not Path('assets/icon.png').is_file():
              raise SystemExit('Missing assets/icon.png')
          PYCODE

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure Firebase Cloud Messaging for Android
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PYCODE'
          from pathlib import Path
          root = Path('android/build.gradle')
          text = root.read_text()
          plugin_line = "classpath 'com.google.gms:google-services:4.4.2'"
          if plugin_line not in text:
              marker = 'dependencies {'
              if marker not in text:
                  raise SystemExit('Could not find dependencies block in android/build.gradle')
              text = text.replace(marker, marker + '\n        ' + plugin_line, 1)
              root.write_text(text)
          app = Path('android/app/build.gradle')
          app_text = app.read_text()
          apply_line = "apply plugin: 'com.google.gms.google-services'"
          if apply_line not in app_text:
              app.write_text(app_text.rstrip() + '\n\n' + apply_line + '\n')
          PYCODE

      - name: Apply WEZTY launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PYCODE'
          from pathlib import Path
          from PIL import Image
          source = Image.open('assets/icon.png').convert('RGBA')
          res = Path('android/app/src/main/res')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in sizes.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png')
              icon.save(folder / 'ic_launcher_round.png')
          # Remove adaptive-icon XML files so they cannot override the supplied PNG icon.
          adaptive = res / 'mipmap-anydpi-v26'
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              (adaptive / name).unlink(missing_ok=True)
          PYCODE

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WEZTY-remote-updates-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
